# Publishes main, and only main, as the production site (q-guard.app).
# The work in progress (dev) and the "alternative" design proposal are
# published separately, with noindex, by preview.yml.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      # Internal files (docs, verification tools, reference screenshots,
      # project notes) are kept out of the public site.
      - name: Assemble site
        run: |
          mkdir -p site
          rsync -a --exclude '.git*' --exclude tools --exclude docs --exclude 'assets/Ref UI' \
            --exclude CLAUDE.md --exclude README.md main/ site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
